name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout current published export
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build:static
        env:
          STATIC_PREBUILT_EXPORT_DIR: ${{ github.workspace }}/previous-pages/export

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
